# Optional: builds the UNITY version (ObstacleDodge.Unity) in the cloud with GameCI.
# Unity needs a license, so first add 3 repository secrets
# (Settings -> Secrets and variables -> Actions -> New repository secret):
#   UNITY_EMAIL, UNITY_PASSWORD  - your Unity ID
#   UNITY_LICENSE                - the contents of your Unity_lic.ulf file
#                                  (Windows: C:\ProgramData\Unity\Unity_lic.ulf,
#                                   macOS: /Library/Application Support/Unity/Unity_lic.ulf)
# Then run it by hand: Actions -> "Unity build" -> Run workflow.
name: Unity build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Android or WebGL'
        required: true
        default: 'Android'
        type: choice
        options: [Android, WebGL]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Check the Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets first (see the top of this file)."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: ObstacleDodge.Unity/Library
          key: Library-${{ inputs.platform }}-${{ hashFiles('ObstacleDodge.Unity/Assets/**', 'ObstacleDodge.Unity/Packages/**', 'ObstacleDodge.Unity/ProjectSettings/**') }}
          restore-keys: Library-${{ inputs.platform }}-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ObstacleDodge.Unity
          targetPlatform: ${{ inputs.platform }}
          buildMethod: ${{ inputs.platform == 'WebGL' && 'BuildScript.BuildWebGL' || 'BuildScript.BuildAndroid' }}

      - uses: actions/upload-artifact@v4
        with:
          name: ObstacleDodge-Unity-${{ inputs.platform }}
          path: ObstacleDodge.Unity/Builds
